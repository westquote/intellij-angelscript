[versions]
jvm = "21"
kotlin = "2.4.21"
# Kotlin API level: the lowest the compiler accepts. 2024.2, the lowest supported platform, bundles Kotlin 1.9, so the
# Plugin Verifier checks that the plugin calls nothing 1.9 lacks.
kotlinApi = "2.0"
intellijPlatform = "2.20.1"
changelog = "2.5.0"
ktlint = "14.2.0"
detekt = "1.23.8"
# The Kotlin version detekt 1.23.8 was built with; detekt fails on any other.
detektKotlin = "2.0.21"
junit = "4.13.2"
opentest4j = "1.3.0"

# Target platform for compilation and tests, and the IDEs the verifier checks. The verifier also checks the newest
# IntelliJ IDEA release and EAP (see build.gradle.kts).
platform = "2026.1"
platformLowest = "2024.2"
# The LSP4IJ the plugin is built and tested with. The verifier checks it on the same IDEs as the plugin, because the
# Marketplace cannot resolve the plugin's dependency on an IDE where LSP4IJ itself has compatibility problems.
lsp4ij = "0.30.1"

# Bundled language server: the westquote/angel-lsp commit CI builds it from, the version at that commit, and the
# Node.js release that builds it and is embedded in each executable.
angelLsp = "0.3.103"
angelLspCommit = "0770ef15815c1c08018192251a08049f833ac864"
nodeRuntime = "24.20.0"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
opentest4j = { module = "org.opentest4j:opentest4j", version.ref = "opentest4j" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellijPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatform" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
