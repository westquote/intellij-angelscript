name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - { platform: windows-x64, runner: windows-latest, executable: angel-lsp-server-win32-x64.exe }
          - { platform: macos-arm64, runner: macos-15, executable: angel-lsp-server-darwin-arm64 }
          - { platform: macos-x64, runner: macos-15-intel, executable: angel-lsp-server-darwin-x64 }
          - { platform: linux-x64, runner: ubuntu-24.04, executable: angel-lsp-server-linux-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: gradle/libs.versions.toml
          sparse-checkout-cone-mode: false
      - name: Read the pinned server commit and Node.js version
        id: pins
        shell: bash
        run: |
          pin() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p" gradle/libs.versions.toml; }
          echo "commit=$(pin angelLspCommit)" >> "$GITHUB_OUTPUT"
          echo "node=$(pin nodeRuntime)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: westquote/angel-lsp
          ref: ${{ steps.pins.outputs.commit }}
          path: angel-lsp
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      # The build embeds the running Node.js, signs ad hoc on macOS, and fails unless the executable answers an
      # LSP initialize request.
      - name: Build the server executable
        working-directory: angel-lsp
        shell: bash
        run: |
          npm ci
          npm ci --prefix server
          npm run standalone --prefix server
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --verbose "angel-lsp/server/dist/${{ matrix.executable }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.platform }}
          path: |
            angel-lsp/server/dist/${{ matrix.executable }}
            angel-lsp/server/dist/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  plugin:
    needs: server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          path: servers
      - name: Collect the server executables
        run: |
          mkdir server-dist
          cp servers/*/angel-lsp-server-* server-dist/
          # Every platform's build writes the same notices; the Windows build's copy is the one packaged.
          windows=servers/server-windows-x64/THIRD-PARTY-NOTICES.txt
          for notices in servers/*/THIRD-PARTY-NOTICES.txt; do
            if ! diff -q <(tr -d '\r' < "$windows") <(tr -d '\r' < "$notices") > /dev/null; then
              echo "::error::$notices differs from $windows"
              exit 1
            fi
          done
          cp "$windows" server-dist/
          { echo '### Server executables'; echo '```'; (cd server-dist && sha256sum angel-lsp-server-*); echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Build, test, lint and verify
        run: ./gradlew build verifyPlugin -PangelLspServerDir=server-dist -PangelLspAllPlatforms=true
      - name: Check the plugin ZIP
        run: |
          zip=$(ls build/distributions/*.zip)
          echo "Plugin ZIP: $(stat -c %s "$zip") bytes"
          for platform in macos-arm64 macos-x64 linux-x64; do
            zipinfo "$zip" "*/server/$platform/angel-lsp" | grep -q '^-rwxr-xr-x'
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  # The locator sets the executable bit on the bundled server, so its tests also run on macOS.
  macos-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew test --tests "*ServerBinaryLocatorTest" --tests "*LexerTest" --tests "*ConfigFileTest"
