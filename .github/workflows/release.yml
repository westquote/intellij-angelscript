name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Pushing the tag publishes the plugin, so a tag that doesn't match pluginVersion stops here, before the build.
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: gradle.properties
          sparse-checkout-cone-mode: false
      - name: Check the tag against pluginVersion
        run: grep -qx "pluginVersion=${GITHUB_REF_NAME#v}" gradle.properties || { echo "::error::$GITHUB_REF_NAME doesn't match pluginVersion"; exit 1; }

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  # Signs the ZIP the build job tested and verified; nothing is built again.
  sign:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: verified
      - name: Sign
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          ./gradlew signPlugin -PreleaseArchive="$(ls verified/*.zip)"
          mkdir signed
          mv verified/*-signed.zip signed/
          (cd signed && sha256sum *-signed.zip > SHA256SUMS && cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-signed
          path: signed/*
          if-no-files-found: error

  release:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-signed
          path: signed
      # The release notes are the version's section of CHANGELOG.md.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd signed && sha256sum --check SHA256SUMS)
          awk -v heading="## [$version]" '
            /^## \[/ || /^\[[^]]+\]: / { if (found) exit; found = index($0, heading) == 1; next }
            found
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" signed/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md

  # Uploads the released ZIP to JetBrains Marketplace. In practice the called workflow gets its environment's
  # PUBLISH_TOKEN only when the caller passes secrets; without this the v0.1.2 upload got an empty token.
  publish:
    needs: release
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
    permissions:
      contents: read
