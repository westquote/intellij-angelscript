name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release to upload, for example v0.1.0
        required: true

permissions:
  contents: read

jobs:
  # Uploads the signed ZIP attached to the release, after checking it against the release's SHA256SUMS.
  publish:
    runs-on: ubuntu-24.04
    environment: marketplace
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          (cd release && sha256sum --check SHA256SUMS)
      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin -x buildPlugin -x signPlugin -PreleaseArchive="$(ls release/*-signed.zip)"
